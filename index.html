<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HlebnTale — Скоро выйдет демо!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 4px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            max-width: 90%;
            width: 600px;
        }

        .title {
            font-size: 16px;
            color: #aaaaaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .timer {
            font-size: 32px;
            color: #ffff00;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 3px 3px #888800;
        }

        .message {
            display: none;
            font-size: 20px;
            color: #00ff00;
            line-height: 1.8;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; border-width: 3px; }
            .title { font-size: 12px; }
            .timer { font-size: 20px; }
            .message { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="countdown-box">
            <div class="title">ДО ВЫХОДА ДЕМО-ВЕРСИИ:</div>
            <div id="timer" class="timer">00:00:00</div>
        </div>

        <div id="finish-message" class="message">
            Давайте начнем наше приключение!
        </div>
    </div>

    <script>
        let serverTimeOffset = 0;
        let targetTime = 0;
        let timerInterval = null;

        async function initTimer() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Europe/Moscow');
                const data = await response.json();
                
                const serverTime = new Date(data.datetime).getTime();
                serverTimeOffset = serverTime - Date.now();

                const mskDate = new Date(data.datetime);
                const year = mskDate.getFullYear();
                const month = String(mskDate.getMonth() + 1).padStart(2, '0');
                const day = String(mskDate.getDate()).padStart(2, '0');
                
                let target = new Date(`${year}-${month}-${day}T18:00:00+03:00`).getTime();
                
                if (serverTime >= target) {
                    const tomorrow = new Date(serverTime + 86400000);
                    const tYear = tomorrow.getFullYear();
                    const tMonth = String(tomorrow.getMonth() + 1).padStart(2, '0');
                    const tDay = String(tomorrow.getDate()).padStart(2, '0');
                    target = new Date(`${tYear}-${tMonth}-${tDay}T18:00:00+03:00`).getTime();
                }

                targetTime = target;
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            } catch (error) {
                const now = new Date();
                const mskDateString = now.toLocaleDateString("en-US", { timeZone: "Europe/Moscow" });
                const target = new Date(`${mskDateString} 18:00:00 GMT+0300`);
                
                if (now.getTime() >= target.getTime()) {
                    target.setDate(target.getDate() + 1);
                }
                targetTime = target.getTime();
                serverTimeOffset = 0;
                
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function updateTimer() {
            if (!targetTime) return;

            const now = Date.now() + serverTimeOffset;
            const distance = targetTime - now;

            if (distance <= 0) {
                document.getElementById("countdown-box").style.display = "none";
                document.getElementById("finish-message").style.display = "block";
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const hDisplay = String(hours).padStart(2, '0');
            const mDisplay = String(minutes).padStart(2, '0');
            const sDisplay = String(seconds).padStart(2, '0');

            document.getElementById("timer").innerText = `${hDisplay}:${mDisplay}:${sDisplay}`;
        }

        initTimer();
    </script>
</body>
</html>

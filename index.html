<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HlebnTale — Скоро выйдет демо!</title>
    <!-- Пиксельный шрифт Undertale/Retro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 4px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            max-width: 90%;
            width: 600px;
        }

        .title {
            font-size: 16px;
            color: #aaaaaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .timer {
            font-size: 32px;
            color: #ffff00; /* Подсветка жёлтым в стиле Undertale */
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 3px 3px #888800;
        }

        .message {
            display: none;
            font-size: 20px;
            color: #00ff00;
            line-height: 1.8;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* Адаптивность под мобильные телефоны */
        @media (max-width: 600px) {
            .container { padding: 20px; border-width: 3px; }
            .title { font-size: 12px; }
            .timer { font-size: 20px; }
            .message { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="countdown-box">
            <div class="title">ДО ВЫХОДА ДЕМО-ВЕРСИИ:</div>
            <div id="timer" class="timer">00:00:00</div>
        </div>

        <div id="finish-message" class="message">
            Давайте начнем наше приключение!
        </div>
    </div>

    <script>
        // Функция получения целевого времени (Сегодня 13:00 МСК)
        function getTargetTime() {
            const now = new Date();
            
            // Преобразуем текущее время в MSK (UTC+3)
            // Создаем объект даты для 13:00 по МСК на сегодняшнее число
            const target = new Date();
            
            // Если нужно конкретную дату, укажи вручную (Год, Месяц-1, День, Часы, Минуты)
            // Например для сегодня:
            target.setHours(13, 0, 0, 0); 

            // Перевод часов с учетом МСК (UTC+3)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const mskNow = new Date(utc + (3600000 * 3));

            // Если 13:00 МСК сегодня уже прошло, ставим на 13:00 завтрашнего дня
            if (mskNow > target) {
                target.setDate(target.getDate() + 1);
            }

            return target.getTime();
        }

        // Указываем целевое время (13:00 по Москве = 10:00 UTC)
        function getMoscowTarget() {
            const now = new Date();
            // Получаем год, месяц, день по Москве
            const mskDateString = now.toLocaleDateString("en-US", { timeZone: "Europe/Moscow" });
            const target = new Date(`${mskDateString} 13:00:00 GMT+0300`);
            
            // Если 13:00 сегодня по МСК уже прошло — ставим 13:00 завтра
            if (now.getTime() >= target.getTime()) {
                target.setDate(target.getDate() + 1);
            }
            return target.getTime();
        }

        const targetTime = getMoscowTarget();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance <= 0) {
                // Таймер окончен
                document.getElementById("countdown-box").style.display = "none";
                document.getElementById("finish-message").style.display = "block";
                clearInterval(timerInterval);
                return;
            }

            // Расчет часов, минут и секунд
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Форматирование с ведущими нулями (01:05:09)
            const hDisplay = String(hours).padStart(2, '0');
            const mDisplay = String(minutes).padStart(2, '0');
            const sDisplay = String(seconds).padStart(2, '0');

            document.getElementById("timer").innerText = `${hDisplay}:${mDisplay}:${sDisplay}`;
        }

        // Запуск и обновление каждую секунду
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
